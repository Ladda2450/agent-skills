name: Validate skills

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check SKILL.md frontmatter
        run: node scripts/validate-skills.mjs
      - name: Check skills CLI discovers every skill
        run: npx -y skills add . --list
